server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # --- Security headers ---
    # HSTS: enforce HTTPS for 1 year once the site is served over TLS.
    # Only meaningful behind TLS, but kept here so it applies the moment TLS is added.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent MIME-type sniffing on responses that the browser might mis-trust.
    add_header X-Content-Type-Options "nosniff" always;
    # Defense against legacy clickjacking via iframe embedding.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Lock down referrer information leaked to third-party sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict powerful browser features to same-origin only.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        font/woff2
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Security headers would be inherited from server block but we re-add
        # because nginx drops inherited add_header when location block has its own.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location ^~ /api/uploads/ {
        proxy_pass http://backend:8000/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
